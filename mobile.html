<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スケジュール">
<meta name="theme-color" content="#4a6cf7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>⚡ DAILY SCHEDULE</title>
<style>
:root {
  --bg:#f4f6fb;--bg3:#f0f3fa;--border:#dde3f0;--border2:#edf0f8;
  --text:#1e2a45;--text2:#7a8ba8;
  --accent:#4a6cf7;--accent2:#6c47ff;
  --green:#10b981;--red:#ef4444;
  --row-h:44px;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
  --sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
body{font-family:-apple-system,'Hiragino Sans','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;}
input,textarea{user-select:text;-webkit-user-select:text;}

/* ── Header ── */
.hdr{background:#fff;border-bottom:1px solid var(--border);padding-top:var(--sat);flex-shrink:0;}
.hdr-top{display:flex;align-items:center;gap:8px;padding:10px 14px 6px;}
.app-logo{font-size:16px;font-weight:800;background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.spacer{flex:1;}
.hdr-btn{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text2);position:relative;}
.hdr-btn:active{background:var(--bg3);}
.hdr-btn.danger{color:var(--red);border-color:#fbd5d5;}
.hdr-btn.sync-ok::after,.hdr-btn.sync-err::after{content:'';position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;border:1.5px solid #fff;}
.hdr-btn.sync-ok::after{background:var(--green);}
.hdr-btn.sync-err::after{background:var(--red);}
.week-nav{display:flex;align-items:center;gap:0;padding:0 4px;}
.warr{background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px;padding:6px 8px;border-radius:8px;flex-shrink:0;}
.warr:active{color:var(--accent);background:var(--bg3);}
.dtabs{display:flex;gap:1px;flex:1;overflow-x:auto;padding:2px 0 0;}
.dtab{flex:1;min-width:40px;padding:6px 2px;text-align:center;cursor:pointer;border-radius:8px 8px 0 0;}
.dtab .dn{font-weight:700;font-size:13px;color:var(--text2);}
.dtab .dd{font-size:10px;color:#adb8cf;}
.dtab.active{background:var(--bg3);}
.dtab.active .dn{color:var(--accent);}
.dtab.active .dd{color:var(--accent2);}
.dtab.is-today .dn::after{content:'';display:block;width:4px;height:4px;background:var(--accent);border-radius:50%;margin:2px auto 0;}
.dtab.past{opacity:.5;}
.dtab.weekend .dn{color:var(--accent2);}

/* ── Main ── */
.main{flex:1;overflow:hidden;position:relative;}
.panel{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:calc(var(--sab) + 70px);}
.panel.active{display:block;}

/* ── Schedule list ── */
.sch-list{background:#fff;}
.slot-row{display:flex;align-items:stretch;border-bottom:1px solid var(--border2);min-height:var(--row-h);position:relative;}
.slot-row.hour-start{border-top:1px solid var(--border);}
.slot-row.occ{display:none;}
.time-cell{width:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text2);border-right:1px solid var(--border2);}
.content-cell{flex:1;padding:3px 8px;display:flex;align-items:stretch;min-width:0;}
.empty-slot{flex:1;display:flex;align-items:center;padding-left:6px;color:#c3cbdd;font-size:13px;}
.empty-slot:active{background:var(--bg3);}

.task-block{
  flex:1;display:flex;align-items:center;gap:6px;
  border-radius:9px;padding:8px 10px;
  font-size:15px;font-weight:600;
  border:1.5px solid;
  position:relative;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.task-block.done{background:#94a3b8 !important;border-color:#64748b !important;color:#fff !important;box-shadow:none;}
.tb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-menu{background:none;border:none;font-size:16px;color:inherit;opacity:.55;padding:4px 2px;flex-shrink:0;}
.task-block.done .tb-menu{opacity:.8;}

.rhandle,.rhandle-top{position:absolute;left:50%;transform:translateX(-50%);width:76px;height:34px;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:6;}
.rhandle{bottom:-24px;cursor:s-resize;}
.rhandle-top{top:-24px;cursor:n-resize;}
.rhandle::after,.rhandle-top::after{content:'';width:34px;height:5px;background:rgba(0,0,0,.18);border-radius:3px;transition:background .1s,transform .1s;}
.task-block.done .rhandle::after,.task-block.done .rhandle-top::after{background:rgba(255,255,255,.4);}
.rhandle.rh-active::after,.rhandle-top.rh-active::after{background:var(--accent);transform:scaleX(1.15);}
.rhandle.rh-active,.rhandle-top.rh-active{background:rgba(74,108,247,.1);border-radius:10px;}

/* ── Task list (tab) ── */
.task-ph{background:var(--bg3);padding:9px 14px;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5;}
.task-ph span{flex:1;}
.add-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 6px rgba(74,108,247,.3);}
.add-btn:active{opacity:.8;}
.task-list{background:#fff;}
.t-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border2);min-height:var(--row-h);position:relative;background:#fff;}
.t-item.done{background:#f1f4f9;}
.t-item.done .t-name-txt{color:#94a3b8;text-decoration:line-through;}
.t-item.in-schedule .t-no{color:var(--accent);font-weight:800;}
.t-item.dragging-self{opacity:.35;}
.t-item.drag-above{box-shadow:inset 0 2px 0 var(--accent);}
.t-item.drag-below{box-shadow:inset 0 -2px 0 var(--accent);}

.t-handle{font-size:16px;color:#c3cbdd;padding:4px 2px;flex-shrink:0;touch-action:none;}
.t-done-btn{width:26px;height:26px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--border);background:#fff;font-size:12px;color:transparent;display:flex;align-items:center;justify-content:center;}
.t-item.done .t-done-btn{background:var(--green);border-color:var(--green);color:#fff;}
.t-no{font-size:11px;font-weight:700;color:var(--text2);width:20px;text-align:center;flex-shrink:0;}
.t-name{flex:1;min-width:0;}
.t-name-txt{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;color:var(--text);}
.t-input{width:100%;background:rgba(74,108,247,.07);border:1.5px solid var(--accent);border-radius:5px;color:var(--text);font-size:15px;font-family:inherit;outline:none;padding:4px 6px;}
.t-edit{background:none;border:none;font-size:15px;padding:5px;color:var(--text2);flex-shrink:0;}
.t-del{background:none;border:none;font-size:18px;padding:5px;color:#c3cbdd;flex-shrink:0;}

/* ── Bottom tab bar ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);display:flex;padding-bottom:var(--sab);z-index:50;}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;background:none;border:none;color:var(--text2);font-size:11px;font-weight:600;}
.tab-btn .ic{font-size:20px;}
.tab-btn.active{color:var(--accent);}

/* ── Sheet (bottom modal) ── */
.overlay{position:fixed;inset:0;background:rgba(20,25,40,.4);z-index:100;display:none;}
.overlay.on{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;z-index:101;
  max-height:75vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(var(--sab) + 8px);}
.sheet.on{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 4px;}
.sheet-title{font-size:14px;font-weight:700;color:var(--text2);padding:6px 18px 10px;}
.sheet-list{overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sheet-item{display:flex;align-items:center;gap:10px;padding:13px 18px;font-size:15px;border-bottom:1px solid var(--border2);}
.sheet-item:active{background:var(--bg3);}
.sheet-item.danger{color:var(--red);}
.sheet-item .si-no{font-size:11px;font-weight:700;color:var(--text2);width:20px;}
.sheet-item .si-ic{width:20px;text-align:center;}
.sheet-empty{padding:24px;text-align:center;color:var(--text2);font-size:13px;}

/* ── Sync panel (reuses .sheet) ── */
.sync-pad{padding:6px 18px 18px;}
.sync-status{font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.6;}
.sync-status b{color:var(--text);}
.sync-row{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.sync-btn{border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;color:#fff;}
.sync-btn.pull{background:linear-gradient(135deg,var(--accent),var(--accent2));}
.sync-btn.push{background:var(--green);}
.sync-btn:active{opacity:.85;}
.sync-btn:disabled{opacity:.5;}
.sync-input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:11px;font-size:14px;font-family:inherit;outline:none;}
.sync-input:focus{border-color:var(--accent);}
.sync-label{font-size:12px;color:var(--text2);margin:4px 0 2px;}
.sync-link{color:var(--accent);font-size:12px;text-decoration:underline;}
.sync-forget{background:none;border:none;color:var(--text2);font-size:12px;text-decoration:underline;padding:4px 0;align-self:flex-start;}
.sync-msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-top:10px;display:none;}
.sync-msg.on{display:block;}
.sync-msg.ok{background:#f0fdf4;color:#16a34a;}
.sync-msg.err{background:#fff1f2;color:#dc2626;}
.sync-hint{font-size:12px;color:var(--text2);line-height:1.7;margin-top:6px;}
.sync-hint ol{padding-left:18px;margin-top:4px;}

/* ── Toast ── */
.toast{position:fixed;bottom:calc(var(--sab) + 78px);left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:#fff;padding:9px 20px;border-radius:20px;font-size:14px;z-index:200;opacity:0;transition:all .22s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(30,42,69,.25);}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Chip colors ── */
.tc0{background:#eff6ff;border-color:#93c5fd;color:#2563eb;}
.tc1{background:#f0fdf4;border-color:#86efac;color:#16a34a;}
.tc2{background:#fffbeb;border-color:#fcd34d;color:#d97706;}
.tc3{background:#fff1f2;border-color:#fca5a5;color:#dc2626;}
.tc4{background:#faf5ff;border-color:#c4b5fd;color:#7c3aed;}
.tc5{background:#ecfeff;border-color:#67e8f9;color:#0891b2;}
.tc6{background:#f0fdf4;border-color:#6ee7b7;color:#059669;}
.tc7{background:#fffde7;border-color:#fde68a;color:#b45309;}
.tc8{background:#fff7ed;border-color:#fdba74;color:#ea580c;}
.tc9{background:#fdf4ff;border-color:#e879f9;color:#a21caf;}

::-webkit-scrollbar{display:none;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="app-logo">⚡ DAILY SCHEDULE</div>
    <span class="spacer"></span>
    <button class="hdr-btn" id="sync-btn" onclick="openSyncSheet()">🔄</button>
    <button class="hdr-btn" onclick="goToday()">今日</button>
    <button class="hdr-btn danger" onclick="resetDay()">↺ リセット</button>
  </div>
  <div class="week-nav">
    <button class="warr" onclick="prevWeek()">‹</button>
    <div class="dtabs" id="dtabs"></div>
    <button class="warr" onclick="nextWeek()">›</button>
  </div>
</div>

<div class="main">
  <div class="panel active" id="panel-schedule">
    <div class="sch-list" id="sch-list"></div>
  </div>
  <div class="panel" id="panel-tasks">
    <div class="task-ph">
      <span>タスク一覧</span>
      <button class="add-btn" onclick="addTask()">＋ 追加</button>
    </div>
    <div class="task-list" id="task-list"></div>
  </div>
</div>

<div class="tabbar">
  <button class="tab-btn active" id="tabbtn-schedule" onclick="switchTab('schedule')"><span class="ic">🗓️</span>スケジュール</button>
  <button class="tab-btn" id="tabbtn-tasks" onclick="switchTab('tasks')"><span class="ic">📋</span>タスク</button>
</div>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="sheet-title"></div>
  <div class="sheet-list" id="sheet-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const ROW_H = 44;
const LONG_PRESS_MS = 420;
const DEFAULT_TASKS = [
  'スケジュール作成','庶務(洗濯)','#投資 高配当株',
  '#民泊 SEO確認／物件チェック','【観光ガイド】Viator','思考時間・読書',
  'Tour Guide案内','運動・サウナ','【サイドFIRE学園】動画編集・台本作成',
  '','','',
  'Trip WorksとTrip Advisorの連携','','',
  '5月イベント（リベ企画）','','','','未来投資','','',
  'SF学園イベント企画！','','','本執筆','Relax','',
  'お風呂・就寝準備','移動','飲み会・夜ご飯','お昼・シャワー','－',
];
function buildSlots(){
  const a=[];
  for(let h=8;h<=23;h++){a.push(p2(h)+':00');a.push(p2(h)+':30');}
  for(let h=0;h<=3;h++){a.push(p2(h)+':00');a.push(p2(h)+':30');}
  return a;
}
function p2(n){return String(n).padStart(2,'0');}
const SLOTS=buildSlots();
const DASH_SI=[0,1,2,3,4,5,32,33,34,35,36,37,38,39];
const DAY_JP=['月','火','水','木','金','土','日'];

// ════ STATE ════
let tasks=[], schedule={}, tasksDone={};
let currentDate=todayStr(), weekOffset=0;
let clipboard=null;
let activeTab='schedule';
let resizing=null, resizingTop=null;
let lastRender=0, lastRenderTop=0;
let taskDrag=null; // {ti, startY, startIndex, curIndex}
let longPressTimer=null, longPressFired=false;

// ════ DATE ════
function todayStr(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function addDays(ds,n){const d=new Date(ds);d.setDate(d.getDate()+n);return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function weekMon(ds){const d=new Date(ds);const dow=d.getDay();d.setDate(d.getDate()+(dow===0?-6:1-dow));return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function weekDates(){const mon=addDays(weekMon(todayStr()),weekOffset*7);return Array.from({length:7},(_,i)=>addDays(mon,i));}
function fmtTab(ds){const d=new Date(ds);return`${d.getMonth()+1}/${d.getDate()}`;}

// ════ PERSISTENCE ════
function save(){
  try{
    localStorage.setItem('dsch6_tasks',JSON.stringify(tasks));
    localStorage.setItem('dsch6_sch',JSON.stringify(schedule));
    const td={};Object.keys(tasksDone).forEach(d=>{td[d]=[...tasksDone[d]];});
    localStorage.setItem('dsch6_done',JSON.stringify(td));
  }catch(e){}
  scheduleAutoPush();
}
function load(){
  try{
    const t=localStorage.getItem('dsch6_tasks');
    const s=localStorage.getItem('dsch6_sch');
    const d=localStorage.getItem('dsch6_done');
    tasks=t?JSON.parse(t):[...DEFAULT_TASKS];
    schedule=s?JSON.parse(s):{};
    if(d){const raw=JSON.parse(d);Object.keys(raw).forEach(ds=>{tasksDone[ds]=new Set(raw[ds]);});}
  }catch(e){tasks=[...DEFAULT_TASKS];schedule={};tasksDone={};}
}

// ════ AUTO-MERGE ════
function autoMergeDay(ds){
  const daySchd=schedule[ds];if(!daySchd)return;
  const flat=new Array(SLOTS.length).fill(null);
  for(let si=0;si<SLOTS.length;si++){
    const e=daySchd[si];if(!e)continue;
    const sp=e.span||1;
    for(let k=0;k<sp;k++)if(si+k<SLOTS.length&&flat[si+k]===null)flat[si+k]={ti:e.ti,done:!!e.done};
  }
  const ns={};let si=0;
  while(si<SLOTS.length){
    const c=flat[si];if(!c){si++;continue;}
    let sp=1;
    while(si+sp<SLOTS.length&&flat[si+sp]&&flat[si+sp].ti===c.ti)sp++;
    ns[si]={ti:c.ti,span:sp,done:c.done};si+=sp;
  }
  schedule[ds]=ns;
}

// ════ DAY INIT ════
function initDay(ds){
  if(schedule[ds])return;
  const ti=tasks.indexOf('－');
  schedule[ds]={};
  if(ti>=0)DASH_SI.forEach(si=>{schedule[ds][si]={ti,span:1,done:false};});
  autoMergeDay(ds);save();
}
function getDone(ds){if(!tasksDone[ds])tasksDone[ds]=new Set();return tasksDone[ds];}

// ════ HELPERS ════
function cc(ti){return'tc'+(ti%10);}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function occupiedSet(ds){
  const occ=new Set();
  SLOTS.forEach((_,si)=>{if(occ.has(si))return;const e=ds[si];if(e&&e.span>1)for(let k=1;k<e.span&&si+k<SLOTS.length;k++)occ.add(si+k);});
  return occ;
}
function maxAvail(si,ds){
  const occ=occupiedSet(ds);
  for(let k=1;si+k<SLOTS.length;k++){const e=ds[si+k];if(e&&!occ.has(si+k))return k;}
  return SLOTS.length-si;
}

// ════ TABS (top day picker) ════
function renderTabs(){
  const el=document.getElementById('dtabs');el.innerHTML='';
  const today=todayStr();
  weekDates().forEach((ds,i)=>{
    const tab=document.createElement('div');
    tab.className='dtab';
    if(ds===currentDate)tab.classList.add('active');
    if(ds===today)tab.classList.add('is-today');
    if(ds<today&&ds!==currentDate)tab.classList.add('past');
    if(i>=5)tab.classList.add('weekend');
    tab.innerHTML=`<div class="dn">${DAY_JP[i]}</div><div class="dd">${fmtTab(ds)}</div>`;
    tab.onclick=()=>{currentDate=ds;initDay(ds);renderTabs();renderSchedule();renderTasks();};
    el.appendChild(tab);
  });
  const activeEl=el.querySelector('.dtab.active');
  if(activeEl)activeEl.scrollIntoView({block:'nearest',inline:'center'});
}

// ════ BOTTOM TAB SWITCH ════
function switchTab(name){
  activeTab=name;
  document.getElementById('panel-schedule').classList.toggle('active',name==='schedule');
  document.getElementById('panel-tasks').classList.toggle('active',name==='tasks');
  document.getElementById('tabbtn-schedule').classList.toggle('active',name==='schedule');
  document.getElementById('tabbtn-tasks').classList.toggle('active',name==='tasks');
}

// ════ RENDER SCHEDULE ════
function renderSchedule(){
  const list=document.getElementById('sch-list');list.innerHTML='';
  initDay(currentDate);autoMergeDay(currentDate);
  const daySchd=schedule[currentDate];
  const occ=occupiedSet(daySchd);

  SLOTS.forEach((time,si)=>{
    const entry=daySchd[si];
    const hasTask=entry!=null;
    const span=hasTask?(entry.span||1):1;
    const isDone=hasTask&&!!entry.done;
    const isOcc=occ.has(si);

    const row=document.createElement('div');
    row.className='slot-row'+(isOcc?' occ':'');
    if(time.endsWith(':00'))row.classList.add('hour-start');
    if(hasTask)row.style.minHeight=(span*ROW_H-1)+'px';

    const tdTime=document.createElement('div');tdTime.className='time-cell';tdTime.textContent=time;
    row.appendChild(tdTime);

    const tdC=document.createElement('div');tdC.className='content-cell';

    if(!isOcc){
      if(hasTask){
        const block=document.createElement('div');
        block.className=`task-block ${cc(entry.ti)}${isDone?' done':''}`;
        block.innerHTML=`<span class="tb-name">${escH(tasks[entry.ti]||'(無題)')}</span><button class="tb-menu">⋮</button>`;

        // tap → toggle done ; menu button / long-press → action sheet
        block.addEventListener('click',e=>{
          if(e.target.closest('.tb-menu')){openSlotMenu(si,entry);return;}
          if(e.target.closest('.rhandle')||e.target.closest('.rhandle-top'))return;
          entry.done=!entry.done;save();renderSchedule();renderTasks();
        });
        attachLongPress(block,()=>openSlotMenu(si,entry));

        const rht=document.createElement('div');rht.className='rhandle-top';
        if(resizingTop&&resizingTop.curSi===si)rht.classList.add('rh-active');
        attachResizeTopPointer(rht,si,span,entry.ti,!!entry.done);
        block.appendChild(rht);

        const rh=document.createElement('div');rh.className='rhandle';
        if(resizing&&resizing.si===si)rh.classList.add('rh-active');
        attachResizePointer(rh,si,span);
        block.appendChild(rh);

        tdC.appendChild(block);
      } else {
        const emp=document.createElement('div');emp.className='empty-slot';emp.textContent='タップしてタスクを配置';
        emp.addEventListener('click',()=>openTaskPicker(si));
        tdC.appendChild(emp);
      }
    }
    row.appendChild(tdC);
    list.appendChild(row);
  });
}

// ════ LONG PRESS HELPER ════
function attachLongPress(el,fn){
  let t=null,fired=false,sx=0,sy=0;
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('.tb-menu')||e.target.closest('.rhandle')||e.target.closest('.rhandle-top'))return;
    fired=false;sx=e.clientX;sy=e.clientY;
    t=setTimeout(()=>{fired=true;fn();},LONG_PRESS_MS);
  });
  const cancel=e=>{
    if(t&&e&&e.type==='pointermove'){
      if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8){clearTimeout(t);t=null;}
      return;
    }
    clearTimeout(t);t=null;
  };
  el.addEventListener('pointermove',cancel);
  el.addEventListener('pointerup',cancel);
  el.addEventListener('pointercancel',cancel);
  el.addEventListener('pointerleave',cancel);
}

// ════ RESIZE (pointer-based, works for touch & mouse) ════
// Drag tracking is bound to `document` (keyed by pointerId) rather than the
// handle element itself: renderSchedule() rebuilds the DOM mid-drag whenever
// the span changes, which would detach a handle-scoped listener and make the
// gesture "stop responding" partway through. Document-level listeners survive
// that re-render, so the drag keeps following the finger to the end.
function attachResizePointer(handle,si,curSpan){
  handle.addEventListener('pointerdown',e=>{
    if(resizing||resizingTop)return;
    e.stopPropagation();e.preventDefault();
    try{handle.setPointerCapture(e.pointerId);}catch(_){}
    handle.classList.add('rh-active');
    resizing={si,date:currentDate,startY:e.clientY,origSpan:curSpan,curSpan,pointerId:e.pointerId};
    document.addEventListener('pointermove',onResizeMoveDoc);
    document.addEventListener('pointerup',onResizeUpDoc);
    document.addEventListener('pointercancel',onResizeUpDoc);
  });
}
function onResizeMoveDoc(e){
  if(!resizing||e.pointerId!==resizing.pointerId)return;
  e.preventDefault();
  autoScrollDuringResize(e.clientY);
  onResizeMove(e);
}

// While dragging a resize handle near the top/bottom edge of the visible
// schedule, auto-scroll the panel so the finger never runs out of screen
// space before reaching the desired time (this mainly affects the top
// handle: moving the start time earlier means dragging upward, and blocks
// near the top of the viewport have little room to drag into otherwise).
function autoScrollDuringResize(clientY){
  const panel=document.getElementById('panel-schedule');
  const rect=panel.getBoundingClientRect();
  const EDGE=70;
  if(clientY<rect.top+EDGE)panel.scrollBy(0,-16);
  else if(clientY>rect.bottom-EDGE)panel.scrollBy(0,16);
}
function onResizeUpDoc(e){
  if(!resizing||e.pointerId!==resizing.pointerId)return;
  document.removeEventListener('pointermove',onResizeMoveDoc);
  document.removeEventListener('pointerup',onResizeUpDoc);
  document.removeEventListener('pointercancel',onResizeUpDoc);
  onResizeUp();
}
function onResizeMove(e){
  if(!resizing)return;
  const now=Date.now();
  const delta=Math.round((e.clientY-resizing.startY)/ROW_H);
  const daySchd=schedule[resizing.date]||{};
  let maxSp=SLOTS.length-resizing.si;
  for(let k=1;resizing.si+k<SLOTS.length;k++){const ex=daySchd[resizing.si+k];if(ex&&k>=resizing.origSpan){maxSp=k;break;}}
  const newSpan=Math.max(1,Math.min(maxSp,resizing.origSpan+delta));
  if(newSpan!==resizing.curSpan){
    resizing.curSpan=newSpan;
    for(let k=1;k<newSpan;k++)delete daySchd[resizing.si+k];
    daySchd[resizing.si]={...daySchd[resizing.si],span:newSpan};
    if(now-lastRender>25){lastRender=now;renderSchedule();}
  }
}
function onResizeUp(){
  if(!resizing)return;
  autoMergeDay(resizing.date);save();
  resizing=null;
  renderSchedule();renderTasks();
}

function attachResizeTopPointer(handle,si,span,ti,done){
  handle.addEventListener('pointerdown',e=>{
    if(resizing||resizingTop)return;
    e.stopPropagation();e.preventDefault();
    try{handle.setPointerCapture(e.pointerId);}catch(_){}
    handle.classList.add('rh-active');
    const endSi=si+span-1;
    resizingTop={origSi:si,date:currentDate,startY:e.clientY,endSi,curSi:si,ti,done,pointerId:e.pointerId};
    document.addEventListener('pointermove',onResizeMoveTopDoc);
    document.addEventListener('pointerup',onResizeUpTopDoc);
    document.addEventListener('pointercancel',onResizeUpTopDoc);
  });
}
function onResizeMoveTopDoc(e){
  if(!resizingTop||e.pointerId!==resizingTop.pointerId)return;
  e.preventDefault();
  autoScrollDuringResize(e.clientY);
  onResizeMoveTop(e);
}
function onResizeUpTopDoc(e){
  if(!resizingTop||e.pointerId!==resizingTop.pointerId)return;
  document.removeEventListener('pointermove',onResizeMoveTopDoc);
  document.removeEventListener('pointerup',onResizeUpTopDoc);
  document.removeEventListener('pointercancel',onResizeUpTopDoc);
  onResizeUpTop();
}
function onResizeMoveTop(e){
  if(!resizingTop)return;
  const now=Date.now();
  const delta=Math.round((resizingTop.startY-e.clientY)/ROW_H);
  const daySchd=schedule[resizingTop.date]||{};
  delete daySchd[resizingTop.curSi];
  let minSi=0;
  for(let k=resizingTop.origSi-1;k>=0;k--){const ex=daySchd[k];if(ex){minSi=k+(ex.span||1);break;}}
  const newSi=Math.max(minSi,Math.min(resizingTop.endSi,resizingTop.origSi-delta));
  daySchd[newSi]={ti:resizingTop.ti,span:resizingTop.endSi-newSi+1,done:resizingTop.done};
  resizingTop.curSi=newSi;
  if(now-lastRenderTop>25){lastRenderTop=now;renderSchedule();}
}
function onResizeUpTop(){
  if(!resizingTop)return;
  autoMergeDay(resizingTop.date);save();
  resizingTop=null;
  renderSchedule();renderTasks();
}

function enterEditMode(nameDiv,ti,name){
  nameDiv.innerHTML='';

// ════ TASK REORDER (pointer drag via handle) ════
function attachTaskDrag(handle,item,ti){
  handle.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const listEl=document.getElementById('task-list');
    const items=[...listEl.children];
    const startIndex=items.indexOf(item);
    taskDrag={ti,startIndex,curIndex:startIndex,startY:e.clientY,itemH:item.offsetHeight};
    item.classList.add('dragging-self');
    handle.setPointerCapture(e.pointerId);

    const mv=ev=>{
      if(!taskDrag)return;
      const dy=ev.clientY-taskDrag.startY;
      const shift=Math.round(dy/taskDrag.itemH);
      let newIndex=Math.max(0,Math.min(items.length-1,taskDrag.startIndex+shift));
      if(newIndex!==taskDrag.curIndex){
        items.forEach(el=>el.classList.remove('drag-above','drag-below'));
        taskDrag.curIndex=newIndex;
      }
      const listEl2=document.getElementById('task-list');
      const rect=listEl2.getBoundingClientRect();
      if(ev.clientY<rect.top+40)listEl2.scrollBy(0,-8);
      if(ev.clientY>rect.bottom-40)listEl2.scrollBy(0,8);
    };
    const up=()=>{
      item.classList.remove('dragging-self');
      handle.removeEventListener('pointermove',mv);
      handle.removeEventListener('pointerup',up);
      handle.removeEventListener('pointercancel',up);
      if(taskDrag&&taskDrag.curIndex!==taskDrag.startIndex){
        reorderTask(taskDrag.ti,taskDrag.startIndex,taskDrag.curIndex);
      }
      taskDrag=null;
    };
    handle.addEventListener('pointermove',mv);
    handle.addEventListener('pointerup',up);
    handle.addEventListener('pointercancel',up);
  });
}

function reorderTask(fromTi,fromIndex,toIndex){
  const newOrder=tasks.map((_,i)=>i);
  newOrder.splice(fromIndex,1);
  newOrder.splice(toIndex,0,fromTi);
  const revMap={};newOrder.forEach((oldTi,newTi)=>{revMap[oldTi]=newTi;});
  Object.keys(schedule).forEach(date=>{
    Object.keys(schedule[date]).forEach(si=>{
      const e=schedule[date][si];
      if(e&&revMap[e.ti]!==undefined)e.ti=revMap[e.ti];
    });
  });
  Object.keys(tasksDone).forEach(date=>{
    tasksDone[date]=new Set([...tasksDone[date]].map(t=>revMap[t]!==undefined?revMap[t]:t));
  });
  tasks=newOrder.map(i=>tasks[i]);
  save();renderTasks();renderSchedule();
  toast('タスク順序を更新しました');
}

// ════ SYNC (GitHub-backed, automatic push/pull) ════
// タスクの内容(一覧・並び順・完了状態・スケジュール配置)をPC/iPhone間で
// 共有するため、リポジトリ内の data/state.json を単一の共有ストアとして使う。
// 読み書きどちらもGitHub Contents API（この端末に保存したPATで認証）。
// 編集のたびに自動アップロード、起動時・復帰時・一定間隔で自動ダウンロードする。
const GH_OWNER='taka92aki', GH_REPO='daily-schedule-app', GH_PATH='data/state.json';
const GH_API_URL=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;

function getPat(){return localStorage.getItem('gh_pat')||'';}
function setPat(v){if(v)localStorage.setItem('gh_pat',v);else localStorage.removeItem('gh_pat');}
function getLastSynced(){return parseInt(localStorage.getItem('sync_last_at')||'0',10);}
function setLastSynced(t){localStorage.setItem('sync_last_at',String(t));}
function b64EncodeUtf8(str){return btoa(unescape(encodeURIComponent(str)));}

// ── Auto-push: debounced so a burst of edits (e.g. dragging a resize
// handle) becomes one commit, not dozens. Skipped while suppressAutoPush
// is set (e.g. while applying a just-pulled remote state) and while no
// token is saved on this device (nothing to auto-push with).
let suppressAutoPush=false;
let autoPushTimer=null;
function scheduleAutoPush(){
  if(suppressAutoPush)return;
  if(!getPat())return;
  clearTimeout(autoPushTimer);
  autoPushTimer=setTimeout(runAutoPush,2500);
}
async function runAutoPush(){
  try{
    const remote=await fetchRemote();
    if(remote&&remote.updatedAt>getLastSynced()){
      // Someone else pushed more recently than what we last saw — pull
      // that in first so we don't clobber it, then push our own edits
      // on top (last-write-wins, but at least we saw the other change).
      applySyncPayload(remote);
    }
    await pushToGithub();
    setSyncIndicator('ok');
  }catch(err){
    setSyncIndicator('err');
  }
}
// ── Auto-pull: on load, whenever the app regains focus/visibility, and
// on a slow background interval while it stays open/visible.
let autoPullTimer=null;
async function autoPullIfNewer(){
  try{
    const remote=await fetchRemote();
    if(remote&&remote.updatedAt>getLastSynced()){
      applySyncPayload(remote);
      setSyncIndicator('ok');
      toast('最新の内容に更新しました');
    }
  }catch(err){/* offline or rate-limited: stay on local data silently */}
}
function setSyncIndicator(state){
  const btn=document.getElementById('sync-btn');
  if(!btn)return;
  btn.classList.remove('sync-ok','sync-err');
  if(state==='ok')btn.classList.add('sync-ok');
  if(state==='err')btn.classList.add('sync-err');
}

function buildSyncPayload(){
  const td={};Object.keys(tasksDone).forEach(d=>{td[d]=[...tasksDone[d]];});
  return{tasks,schedule,tasksDone:td,updatedAt:Date.now()};
}
function applySyncPayload(remote){
  suppressAutoPush=true;
  tasks=remote.tasks||[];
  schedule=remote.schedule||{};
  tasksDone={};
  Object.keys(remote.tasksDone||{}).forEach(d=>{tasksDone[d]=new Set(remote.tasksDone[d]);});
  save();
  initDay(currentDate);
  renderTabs();renderSchedule();renderTasks();
  setLastSynced(remote.updatedAt||Date.now());
  suppressAutoPush=false;
}
async function fetchRemote(){
  // raw.githubusercontent.com sits behind a CDN that can cache the "main"
  // branch pointer per-edge-node for several minutes, ignoring cache-busting
  // query params entirely (it isn't designed for frequently-changing refs).
  // api.github.com reflects the current commit immediately, so use that for
  // reads instead — this is what actually makes "download" trustworthy.
  const headers={Accept:'application/vnd.github.raw'};
  const pat=getPat();
  if(pat)headers.Authorization='token '+pat;
  const res=await fetch(GH_API_URL,{headers,cache:'no-store'});
  if(res.status===404)return null;
  if(!res.ok)throw new Error('取得に失敗しました ('+res.status+')');
  return res.json();
}
async function pullFromGithub(){
  const remote=await fetchRemote();
  if(!remote)throw new Error('まだGitHub上にデータがありません。先に「アップロード」してください。');
  applySyncPayload(remote);
  return remote;
}
async function pushToGithub(){
  const pat=getPat();
  if(!pat)throw new Error('トークンが設定されていません');
  let sha;
  const getRes=await fetch(GH_API_URL,{headers:{Authorization:'token '+pat,Accept:'application/vnd.github+json'}});
  if(getRes.status===200){sha=(await getRes.json()).sha;}
  else if(getRes.status!==404){throw new Error('確認に失敗しました ('+getRes.status+')');}
  const payload=buildSyncPayload();
  const body={message:'sync task data from mobile',content:b64EncodeUtf8(JSON.stringify(payload,null,2))};
  if(sha)body.sha=sha;
  const putRes=await fetch(GH_API_URL,{method:'PUT',headers:{Authorization:'token '+pat,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!putRes.ok){
    let msg='アップロードに失敗しました ('+putRes.status+')';
    if(putRes.status===401)msg='トークンが無効です。設定し直してください。';
    throw new Error(msg);
  }
  setLastSynced(payload.updatedAt);
  return payload;
}
function fmtSyncTime(t){
  if(!t)return'未同期';
  const d=new Date(t);
  return`${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
function openSyncSheet(){
  const pat=getPat();
  document.getElementById('sheet-title').textContent='🔄 同期';
  const listEl=document.getElementById('sheet-list');
  listEl.innerHTML=`
    <div class="sync-pad">
      <div class="sync-status">最終同期: <b id="sync-last">${fmtSyncTime(getLastSynced())}</b><br>${pat?'自動で同期しています（編集後は数秒、起動時・切替時は自動で反映）。':'トークンを保存すると、以後は自動で同期されます。'}</div>
      <div class="sync-row">
        <button class="sync-btn pull" id="sync-pull-btn">⬇️ 今すぐ取り込む</button>
        <button class="sync-btn push" id="sync-push-btn" ${pat?'':'disabled'}>⬆️ 今すぐアップロード</button>
      </div>
      <div id="sync-token-area"></div>
      <div class="sync-msg" id="sync-msg"></div>
      <button class="sync-forget" id="sync-hardreset-btn" style="margin-top:14px;">同期がうまく反映されない場合はこちら（アプリを強制更新）</button>
    </div>`;
  renderSyncTokenArea();
  document.getElementById('sync-hardreset-btn').onclick=hardResetApp;
  document.getElementById('sync-pull-btn').onclick=onSyncPullClick;
  document.getElementById('sync-push-btn').onclick=onSyncPushClick;
  document.getElementById('overlay').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  sheetOpen=true;
}
function renderSyncTokenArea(){
  const pat=getPat();
  const area=document.getElementById('sync-token-area');
  if(pat){
    area.innerHTML=`<button class="sync-forget" id="sync-forget-btn">この端末のトークンを削除</button>`;
    document.getElementById('sync-forget-btn').onclick=()=>{
      setPat('');renderSyncTokenArea();
      document.getElementById('sync-push-btn').disabled=true;
      showSyncMsg('トークンを削除しました','ok');
    };
  }else{
    area.innerHTML=`
      <div class="sync-label">GitHubトークン（アップロードに必要・この端末にのみ保存）</div>
      <input type="password" class="sync-input" id="sync-pat-input" placeholder="github_pat_xxxxxxxx" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="sync-hint">
        GitHub → Settings → Developer settings → Fine-grained tokens で発行し、
        リポジトリを <b>${GH_OWNER}/${GH_REPO}</b> のみに限定、
        Permissions の <b>Contents: Read and write</b> を付与してください。
        <ol><li>生成したトークンをここに貼り付け</li><li>「保存」をタップ</li></ol>
      </div>
      <div class="sync-row" style="margin-top:8px;">
        <button class="sync-btn push" id="sync-pat-save">保存</button>
      </div>`;
    document.getElementById('sync-pat-save').onclick=()=>{
      const v=document.getElementById('sync-pat-input').value.trim();
      if(!v){showSyncMsg('トークンを入力してください','err');return;}
      setPat(v);renderSyncTokenArea();
      document.getElementById('sync-push-btn').disabled=false;
      showSyncMsg('トークンを保存しました。自動同期を開始します…','ok');
      runAutoPush();
    };
  }
}
function showSyncMsg(msg,kind){
  const el=document.getElementById('sync-msg');
  if(!el)return;
  el.textContent=msg;el.className='sync-msg on '+kind;
}
async function onSyncPullClick(){
  const btn=document.getElementById('sync-pull-btn');
  btn.disabled=true;btn.textContent='取り込み中…';
  try{
    await pullFromGithub();
    document.getElementById('sync-last').textContent=fmtSyncTime(getLastSynced());
    showSyncMsg('GitHubの内容を取り込みました','ok');
    toast('同期しました');
  }catch(err){
    showSyncMsg(err.message,'err');
  }finally{
    btn.disabled=false;btn.textContent='⬇️ GitHubから取り込む';
  }
}
async function onSyncPushClick(){
  const btn=document.getElementById('sync-push-btn');
  btn.disabled=true;btn.textContent='アップロード中…';
  try{
    const remote=await fetchRemote();
    if(remote&&remote.updatedAt>getLastSynced()){
      if(!confirm('GitHub上のデータがこの端末より新しいようです。上書きしてアップロードしますか？')){
        btn.disabled=false;btn.textContent='⬆️ この端末の内容をアップロード';return;
      }
    }
    await pushToGithub();
    document.getElementById('sync-last').textContent=fmtSyncTime(getLastSynced());
    showSyncMsg('GitHubにアップロードしました','ok');
    toast('同期しました');
  }catch(err){
    showSyncMsg(err.message,'err');
  }finally{
    btn.disabled=false;btn.textContent='⬆️ この端末の内容をアップロード';
  }
}

// iOSのホーム画面アプリはService Workerの更新に気づきにくいことがあるため、
// 同期がおかしいときに手動でキャッシュ/SWを破棄して確実に最新版を取り直せる
// 「強制更新」ボタン。ローカルのタスクデータ(localStorage)は消さない。
async function hardResetApp(){
  const btn=document.getElementById('sync-hardreset-btn');
  if(btn){btn.disabled=true;btn.textContent='更新中…';}
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs)await r.unregister();
    }
    if('caches' in window){
      const names=await caches.keys();
      for(const n of names)await caches.delete(n);
    }
  }catch(_){/* ignore */}
  location.reload(true);
}

// Auto-pull: catch up on load, whenever the app regains focus/visibility,
// and periodically while it stays open — so switching devices "just works"
// without an explicit sync tap.
autoPullIfNewer();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')autoPullIfNewer();
});
window.addEventListener('focus',()=>autoPullIfNewer());
setInterval(()=>{if(document.visibilityState==='visible')autoPullIfNewer();},30000);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
