<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ DAILY SCHEDULE</title>
<script>
  // タッチ操作がメインの端末（スマホ・タブレット）は mobile.html、
  // マウス操作のPCは pc.html（従来のドラッグ&ドロップ版）へ振り分け。
  var isTouch = window.matchMedia('(pointer: coarse)').matches;
  var isNarrow = window.innerWidth < 900;
  var target = (isTouch || isNarrow) ? 'mobile.html' : 'pc.html';
  location.replace(target);
</script>
</head>
<body>
<noscript>
  <p>JavaScriptを有効にするか、直接 <a href="pc.html">pc.html</a>（PC版）または <a href="mobile.html">mobile.html</a>（スマホ版）を開いてください。</p>
</noscript>
</body>
</html>
